<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="scoreboard">
    <div class="score">X: <span id="scoreX">0</span></div>
    <div class="score">O: <span id="scoreO">0</span></div>
  </div>
  <div class="board" id="board"></div>

  <div class="buttons">
    <button id="newGameBtn">New Game</button>
    <button id="resetBtn">Reset Scores</button>
    <button id="modeBtn">Play vs Computer</button>
    <button id="soundBtn">🔊 Sound</button>
  </div>

  <div id="trophy" class="trophy">🏆</div>

  <!-- Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
