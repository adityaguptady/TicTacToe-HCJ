<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      background-color: #f0f4ff;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #0047ab;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 280px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 10px 0;
      margin-bottom: 20px;
    }

    .score {
      text-align: center;
      color: #0047ab;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 10px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #0047ab;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .cell:hover {
      transform: scale(1.05);
      background-color: #eaf0ff;
    }

    .winner {
      animation: winner-glow 1s ease-in-out infinite alternate;
      background-color: #d6e4ff !important;
    }

    @keyframes winner-glow {
      0% { box-shadow: 0 0 10px 2px #0047ab; }
      100% { box-shadow: 0 0 20px 6px #00bfff; }
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      background: #0047ab;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      margin: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0066ff;
    }

    .trophy {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 4rem;
      opacity: 0;
      display: none;
      z-index: 10;
    }

    .show-trophy {
      display: block;
      animation: trophy-pop 1s ease forwards;
    }

    @keyframes trophy-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .muted {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="scoreboard">
    <div class="score">X: <span id="scoreX">0</span></div>
    <div class="score">O: <span id="scoreO">0</span></div>
  </div>
  <div class="board" id="board"></div>

  <div class="buttons">
    <button id="newGameBtn">New Game</button>
    <button id="resetBtn">Reset Scores</button>
    <button id="modeBtn">Play vs Computer</button>
    <button id="soundBtn">🔊 Sound</button>
  </div>

  <div id="trophy" class="trophy">🏆</div>

  <!-- Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const board = document.getElementById("board");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const newGameBtn = document.getElementById("newGameBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modeBtn = document.getElementById("modeBtn");
    const soundBtn = document.getElementById("soundBtn");
    const trophy = document.getElementById("trophy");

    let cells = [];
    let currentPlayer = "X";
    let vsComputer = false;
    let scoreX = 0, scoreO = 0;
    let soundEnabled = true;
    let gameOver = false;

    const clickSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3");
    const winSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-winning-notification-2018.mp3");
    const drawSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-retro-game-notification-212.mp3");

    function playSound(sound) {
      if (soundEnabled) sound.play();
    }

    function createBoard() {
      board.innerHTML = "";
      cells = [];
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => makeMove(i));
        board.appendChild(cell);
        cells.push(cell);
      }
      gameOver = false;
      hideTrophy();
    }

    function makeMove(i) {
      if (cells[i].textContent || gameOver) return;
      playSound(clickSound);
      cells[i].textContent = currentPlayer;

      if (checkWin()) {
        handleWin(currentPlayer);
        return;
      }

      if (cells.every(c => c.textContent)) {
        handleDraw();
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";

      if (vsComputer && currentPlayer === "O") {
        setTimeout(computerMove, 500);
      }
    }

    function computerMove() {
      const emptyCells = cells.map((c, i) => (c.textContent ? null : i)).filter(i => i !== null);
      const move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      makeMove(move);
    }

    function checkWin() {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.find(([a,b,c]) => 
        cells[a].textContent && 
        cells[a].textContent === cells[b].textContent && 
        cells[a].textContent === cells[c].textContent
      );
    }

    function handleWin(player) {
      gameOver = true;
      playSound(winSound);
      const winCombo = checkWin();
      winCombo.forEach(i => cells[i].classList.add("winner"));

      if (player === "X") scoreX++; else scoreO++;
      scoreXEl.textContent = scoreX;
      scoreOEl.textContent = scoreO;

      showTrophy();
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }

    function handleDraw() {
      playSound(drawSound);
      alert("It's a Draw!");
      gameOver = true;
    }

    function showTrophy() {
      trophy.classList.add("show-trophy");
      setTimeout(() => {
        hideTrophy();
      }, 3000);
    }

    function hideTrophy() {
      trophy.classList.remove("show-trophy");
      trophy.style.display = "none";
    }

    function newGame() {
      createBoard();
      currentPlayer = "X";
      gameOver = false;
    }

    function resetScores() {
      scoreX = 0; scoreO = 0;
      scoreXEl.textContent = 0;
      scoreOEl.textContent = 0;
      newGame();
    }

    newGameBtn.onclick = newGame;
    resetBtn.onclick = resetScores;
    modeBtn.onclick = () => {
      vsComputer = !vsComputer;
      modeBtn.textContent = vsComputer ? "Play vs Player" : "Play vs Computer";
      newGame();
    };
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 Sound" : "🔇 Muted";
      soundBtn.classList.toggle("muted");
    };

    createBoard();
  </script>
</body>
</html>
